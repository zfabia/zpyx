# Site settings
title: Take Nothing But Pictures
email: "iamzaldy@outlook.com"
description: "Zaldy's Photo Gallery"
url: "https://zfabia.github.io"
baseurl: "/zpyx"
owner_name: Zaldy Fabia
facebook_username: "zaldyfabia"
twitter_username: "thezaldyfabia"
instagram_username: "zaldy.fabia"
github_username:  "zfabia"
# deviantart_username: ""
flickr_username: "zaldy_fabia"
# discus_shortname: ""
share: true

# Owner/author information
owner:
  name:   Zaldy Fabia
  avatar: avatar.png
  favicon: favicon.webp
  info: photography travel

# Settings for comments helper
# Set 'provider' to the comment provider you want to use. (i.e.  Disqus, Intense Debate, livefyre, or Facebook Comments)
# Set 'provider' to false to turn commenting off globally.
#Set 'provider: false' to disable comments globally.
# Disable comments for individual pages/posts by specifying 'comments: false' in the page/post YAML Front Matter.
#
comments :
  provider : false
  disqus :
    short_name : ""

# Internal nav
nav:
  - GALLERY: "https://zfabia.github.io/zpyx/gallery/"  
  - JOURNAL: "https://zfabia.github.io/zpyx/journal/"
  - ABOUT: "https://zfabia.github.io/zpyx/about/"
  - GUESTBOOK : "https://pub1.bravenet.com/guestbook/50005949/"
  

# All translation keys
translations:
 # 404.html
  permalink: "/404.html"

# Server
destination:      	 ./_site
port:             	 4000


# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
paginate: 5
paginate_path: "/journal/page:num/"
permalink: "/journal/:title/"
categories_path: "/journal/category/"
tags_path: "/journal/tag/"
gems: 
 - jekyll-paginate
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]

# SiteMap
sitemap:
    file: "/sitemap.xml"
    exclude:
        - "/atom.xml"
        - "/feed.xml"
        - "/feed/index.xml"
    include_posts:
        - "/writing/"
    change_frequency_name: "change_frequency"
    priority_name: "priority"
